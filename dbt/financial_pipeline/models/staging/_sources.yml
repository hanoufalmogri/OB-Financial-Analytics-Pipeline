version: 2

sources:
  - name: bronze
    schema: public
    tables:
      - name: raw_users
        columns:
          - name: gender
            tests:
              - accepted_values:
                  values: ['Female', 'Male']

      - name: raw_cards
        columns:
          - name: card_brand
            tests:
              - accepted_values:
                  values: ['Amex', 'Discover', 'Mastercard', 'Visa']
          - name: card_type
            tests:
              - accepted_values:
                  values: ['Credit', 'Debit', 'Debit (Prepaid)']
          - name: has_chip
            tests:
              - accepted_values:
                  values: ['YES', 'NO']
          - name: card_on_dark_web
            tests:
              - accepted_values:
                  values: ['Yes', 'No']

      - name: raw_mcc_codes

      - name: raw_transactions
        columns:
          - name: use_chip
            tests:
              - accepted_values:
                  values: ['Chip Transaction', 'Online Transaction', 'Swipe Transaction']

      - name: raw_fraud_labels
        columns:
          - name: is_fraud
            tests:
              - accepted_values:
                  values: ['Yes', 'No']
